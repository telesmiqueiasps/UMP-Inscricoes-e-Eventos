[build]
  command = "node build.js"
  publish = "dist"

[[redirects]]
  from = "/usuario"
  to = "/usuario/login.html"
  status = 301

[[redirects]]
  from = "/usuario/"
  to = "/usuario/login.html"
  status = 301

[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 301

[[redirects]]
  from = "/admin/"
  to = "/admin/index.html"
  status = 301
