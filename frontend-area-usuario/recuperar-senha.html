<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar Senha — UMP Eventos</title>
  <link rel="icon" href="img/logo.png" type="image/png">
  <link rel="preload" as="image" href="img/background-login.webp" type="image/webp">
  
  <!-- Google Fonts: Inter & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/login-auth.css">
  <style>
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .spinner {
      display: inline-block;
      width: 1.1rem;
      height: 1.1rem;
      border: 2px solid rgba(21, 87, 214, 0.2);
      border-radius: 50%;
      border-top-color: var(--primary);
      animation: spin 0.8s linear infinite;
    }
  </style>
</head>
<body class="auth-page">

  <!-- Cartão Translúcido de Recuperação de Senha -->
  <main class="auth-card">
    
    <!-- Cabeçalho com Logo Oficial da Marca -->
    <div class="auth-header">
      <img src="img/logo.png" alt="UMP Eventos" class="auth-logo" onerror="this.style.display='none';">
      <h1 class="auth-title">Recuperar Senha</h1>
      <p class="auth-subtitle">Informe seu e-mail cadastrado para redefinir o acesso</p>
    </div>

    <!-- Formulário de Recuperação -->
    <form id="recover-form">
      <div class="auth-form-group">
        <div class="auth-input-wrapper">
          <svg class="auth-input-icon" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="20" height="16" x="2" y="4" rx="2"/>
            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
          </svg>
          <input type="email" id="recover-email" class="auth-input" placeholder="Seu e-mail cadastrado" required autocomplete="email" style="padding-right: 3rem;">
          <div id="email-check-spinner" style="display: none; position: absolute; right: 1rem; top: 50%; transform: translateY(-50%);">
            <div class="spinner"></div>
          </div>
        </div>
      </div>

      <div id="email-status-msg" style="display: none; font-size: 0.85rem; margin-bottom: 1rem; font-weight: 500; padding: 0.65rem 0.85rem; border-radius: 12px; line-height: 1.4;"></div>

      <div id="recover-error" style="display: none; background: #fee2e2; color: #b91c1c; padding: 0.75rem; border-radius: 12px; border: 1px solid #fca5a5; font-size: 0.85rem; margin-bottom: 1rem; text-align: center; font-weight: 500;"></div>
      <div id="recover-success" style="display: none; background: #d1fae5; color: #065f46; padding: 0.75rem; border-radius: 12px; border: 1px solid #a7f3d0; font-size: 0.85rem; margin-bottom: 1rem; text-align: center; font-weight: 500;"></div>

      <button type="submit" id="recover-submit-btn" class="auth-btn-primary" disabled>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
        <span>Recuperar Senha</span>
      </button>

      <div class="auth-switch-link" style="margin-top: 1.25rem;">
        <a href="login.html" style="display: inline-flex; align-items: center; gap: 6px; font-weight: 600;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"/>
          </svg>
          <span>Voltar para o Login</span>
        </a>
      </div>
    </form>

    <!-- Botão Retornar ao Site Público -->
    <button type="button" class="auth-back-btn" onclick="voltarParaSitePublico()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
      <span>Voltar para o Início</span>
    </button>

  </main>

  <footer class="auth-footer">
    <p>&copy; 2026 UMP Eventos. Desenvolvido por Miquéias Teles. Todos os direitos reservados.</p>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/recuperar-senha.js"></script>
  <script>
    function voltarParaSitePublico() {
      window.location.href = '/';
    }
  </script>
</body>
</html>
