<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Área do Participante - UMP Eventos</title>
  <link rel="icon" href="img/logo.png" type="image/png">
  <link rel="stylesheet" href="css/style.css">
  <style>
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; background: var(--light-bg); padding: 2rem 1rem;">

  <main class="card" style="width: 100%; max-width: 440px; padding: 2.5rem;">
    
    <div style="text-align: center; margin-bottom: 2rem;">
      <img src="img/logo.png" alt="Logo" style="height: 54px; object-fit: contain; margin-bottom: 0.5rem;" onerror="this.style.display='none';">
      <h2 style="font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 1.6rem; color: var(--primary);">Área do Participante</h2>
      <p style="color: var(--text-muted); font-size: 0.9rem;">Acesse suas inscrições e parcelas</p>
    </div>

    <div style="display: flex; gap: 0.5rem; margin-bottom: 1.5rem;">
      <button id="tab-login-btn" class="btn btn-primary" style="flex: 1;" onclick="toggleAuthTab('login')">Entrar</button>
      <button id="tab-reg-btn" class="btn btn-outline" style="flex: 1;" onclick="toggleAuthTab('register')">Cadastrar</button>
    </div>

    <!-- Form Login -->
    <div id="box-login">
      <form id="login-form">
        <div class="form-group">
          <label class="form-label">E-mail</label>
          <input type="email" id="login-email" class="form-control" placeholder="seu@email.com" required>
        </div>

        <div class="form-group" style="margin-bottom: 0.75rem;">
          <label class="form-label">Senha</label>
          <input type="password" id="login-senha" class="form-control" placeholder="******" required>
        </div>

        <div style="text-align: right; margin-top: -0.25rem; margin-bottom: 1.25rem;">
          <a href="recuperar-senha.html" style="font-size: 0.8rem; color: var(--primary); text-decoration: none; font-weight: 600;">Esqueceu a senha?</a>
        </div>

        <div id="login-error" style="display: none; background: #fee2e2; color: #b91c1c; padding: 0.75rem; border-radius: var(--radius-md); border: 1px solid #fca5a5; font-size: 0.85rem; margin-bottom: 1rem; text-align: center; font-weight: 500;"></div>

        <button type="submit" id="login-submit-btn" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
          Acessar Painel
        </button>
      </form>
    </div>

    <!-- Form Cadastro -->
    <div id="box-register" style="display: none;">
      <form id="register-form">
        <div class="form-group">
          <label class="form-label">Nome Completo</label>
          <input type="text" id="reg-nome" class="form-control" required>
        </div>

        <div class="form-group">
          <label class="form-label">E-mail</label>
          <input type="email" id="reg-email" class="form-control" required>
        </div>

        <div class="form-group">
          <label class="form-label">CPF</label>
          <input type="text" id="reg-cpf" class="form-control" placeholder="000.000.000-00" required pattern="^\d{3}\.\d{3}\.\d{3}-\d{2}$" title="Digite o CPF no formato 000.000.000-00">
        </div>

        <div class="form-group">
          <label class="form-label">Telefone / WhatsApp</label>
          <input type="text" id="reg-telefone" class="form-control" placeholder="(00) 00000-0000" required pattern="^\(\d{2}\)\s\d{5}-\d{4}$" title="Digite o telefone no formato (00) 00000-0000">
        </div>

        <div class="form-group">
          <label class="form-label">Senha</label>
          <input type="password" id="reg-senha" class="form-control" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
          Criar Minha Conta
        </button>
      </form>
    </div>

    <div style="margin-top: 1.5rem; border-top: 1px solid var(--border-color); padding-top: 1.25rem;">
      <button type="button" class="btn btn-outline" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 0.5rem; height: 42px; font-weight: 500;" onclick="voltarParaSitePublico()">
        <span>🌐</span> Voltar para o Site Público
      </button>
    </div>

  </main>

  <footer style="margin-top: 1.5rem; text-align: center; font-size: 0.8rem; color: var(--text-muted);">
    <p>&copy; 2026 UMP Eventos. Desenvolvido por Miquéias Teles. Todos os direitos reservados.</p>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    function voltarParaSitePublico() {
      window.location.href = 'https://inscricoessinodalpb.netlify.app/';
    }
  </script>
</body>
</html>
