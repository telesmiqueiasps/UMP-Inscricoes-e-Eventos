<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>Cardápio da Cantina — Acamp Sinodal 2026</title>
  <link rel="icon" href="img/acamp-sinodal-logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Caveat:wght@700&family=Outfit:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Teko:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    :root {
      --bg-petroleum-dark: #001618;
      --bg-petroleum-base: #001E21;
      --bg-petroleum-mid: #00363A;
      --bg-petroleum-light: #004C50;
      --accent-orange: #FF7900;
      --accent-emerald: #00B894;
      --accent-gold: #FFB703;
      --accent-gold-soft: #FFD166;
      --card-surface: rgba(0, 30, 35, 0.9);
      --card-border: rgba(255, 255, 255, 0.12);
      --text-white: #FFFFFF;
      --text-slate: #CBD5E1;
      --text-muted: #94A3B8;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden !important;
      background-color: var(--bg-petroleum-dark);
      color: var(--text-white);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    body.cantina-menu-body {
      background-image:
        radial-gradient(circle at 10% 15%, rgba(0, 184, 148, 0.16) 0%, transparent 45%),
        radial-gradient(circle at 90% 80%, rgba(255, 121, 0, 0.16) 0%, transparent 48%),
        linear-gradient(165deg, #001416 0%, #001E21 50%, #001416 100%);
      background-attachment: fixed;
      position: relative;
      padding-bottom: 6rem;
    }

    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }

    /* Contêiner Seguro de Fundo (Zero Overflow) */
    .bg-decorations-wrapper {
      position: fixed;
      inset: 0;
      width: 100%;
      max-width: 100vw;
      height: 100%;
      overflow: hidden !important;
      pointer-events: none;
      z-index: 0;
    }

    .bg-mesh-pattern {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px);
      background-size: 22px 22px;
      opacity: 0.65;
    }

    .bg-glow-tl {
      position: absolute;
      top: -80px;
      left: -80px;
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(255, 121, 0, 0.35) 0%, transparent 70%);
      filter: blur(45px);
    }

    .bg-glow-br {
      position: absolute;
      bottom: -90px;
      right: -90px;
      width: 340px;
      height: 340px;
      background: radial-gradient(circle, rgba(0, 184, 148, 0.3) 0%, transparent 70%);
      filter: blur(50px);
    }

    /* Topo / Navbar */
    .menu-topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      width: 100%;
      background: rgba(0, 20, 22, 0.92);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding: 0.65rem 1rem;
    }

    .menu-topbar-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.6rem;
    }

    .brand-cluster {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      text-decoration: none;
      color: #FFFFFF;
      min-width: 0;
    }

    .brand-cluster img {
      height: 42px;
      width: auto;
      max-width: 110px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .brand-title-wrap {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .brand-title-main {
      font-family: 'Outfit', sans-serif;
      font-weight: 900;
      font-size: clamp(0.92rem, 3.2vw, 1.15rem);
      letter-spacing: -0.01em;
      line-height: 1.15;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #FFFFFF;
    }

    .brand-title-sub {
      font-size: 0.68rem;
      color: var(--text-muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      flex-shrink: 0;
    }

    .btn-hud {
      background: rgba(255, 255, 255, 0.08);
      color: #F8FAFC;
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 0.45rem 0.75rem;
      border-radius: 10px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
      text-decoration: none;
      transition: all 0.2s ease;
      min-height: 36px;
    }

    .btn-hud:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 121, 0, 0.5);
    }

    .btn-hud-orange {
      background: linear-gradient(135deg, #FF7900 0%, #EA580C 100%);
      border-color: rgba(255, 255, 255, 0.22);
      color: #FFFFFF;
      box-shadow: 0 4px 14px rgba(255, 121, 0, 0.3);
    }

    .btn-hud-orange:hover {
      background: linear-gradient(135deg, #FF881B 0%, #F97316 100%);
    }

    /* Container Principal */
    .menu-main-container {
      position: relative;
      z-index: 2;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0.9rem 0.9rem 2rem;
      width: 100%;
    }

    /* Barra de Status e Controles Compacta */
    .controls-panel {
      background: rgba(0, 30, 35, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 0.85rem;
      margin-bottom: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      box-shadow: 0 8px 24px -6px rgba(0, 0, 0, 0.45);
    }

    .status-and-search-row {
      display: flex;
      gap: 0.65rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .status-pill-live {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.38rem 0.75rem;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      background: rgba(0, 184, 148, 0.16);
      border: 1px solid rgba(0, 184, 148, 0.45);
      color: #34D399;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .status-pill-live.fechada {
      background: rgba(255, 183, 3, 0.14);
      border-color: rgba(255, 183, 3, 0.4);
      color: var(--accent-gold-soft);
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 8px currentColor;
    }

    .search-input-wrap {
      position: relative;
      flex: 1;
      min-width: 180px;
    }

    .search-input-wrap svg {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      height: 40px;
      background: rgba(0, 18, 20, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      padding: 0 0.85rem 0 2.35rem;
      color: #FFFFFF;
      font-size: 0.88rem;
      font-family: inherit;
      transition: border-color 0.2s;
    }

    .search-input::placeholder {
      color: var(--text-muted);
    }

    .search-input:focus {
      outline: none;
      border-color: var(--accent-orange);
    }

    .filter-options-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.65rem;
      flex-wrap: wrap;
    }

    .filter-available-label {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-slate);
      cursor: pointer;
      user-select: none;
      padding: 0.35rem 0.65rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      min-height: 34px;
    }

    .filter-available-label input {
      width: 16px;
      height: 16px;
      accent-color: var(--accent-emerald);
      cursor: pointer;
    }

    .total-produtos-counter {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .total-produtos-counter strong {
      color: var(--accent-gold-soft);
    }

    /* Chips de Categorias */
    .cat-chips-row {
      display: flex;
      gap: 0.45rem;
      overflow-x: auto;
      padding-bottom: 0.2rem;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }

    .cat-chips-row::-webkit-scrollbar {
      display: none;
    }

    .cat-chip-btn {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-slate);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 0.4rem 0.8rem;
      border-radius: 999px;
      font-size: 0.76rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      min-height: 32px;
      flex-shrink: 0;
    }

    .cat-chip-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #FFFFFF;
    }

    .cat-chip-btn.active {
      background: linear-gradient(135deg, var(--accent-orange) 0%, #EA580C 100%);
      color: #FFFFFF;
      border-color: rgba(255, 255, 255, 0.28);
      box-shadow: 0 4px 12px rgba(255, 121, 0, 0.3);
    }

    /* Grid de Produtos Otimizada para Mobile e Desktop */
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 1rem;
      width: 100%;
    }

    /* Responsividade Mobile: 2 colunas compactas e elegantes */
    @media (max-width: 768px) {
      .menu-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.65rem;
      }
    }

    @media (max-width: 360px) {
      .menu-grid {
        grid-template-columns: minmax(0, 1fr);
        gap: 0.75rem;
      }
    }

    .menu-item-card {
      position: relative;
      background: var(--card-surface);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 8px 20px -6px rgba(0, 0, 0, 0.5);
    }

    .menu-item-card:hover {
      border-color: rgba(255, 121, 0, 0.45);
      box-shadow: 0 12px 28px -8px rgba(0, 0, 0, 0.65);
    }

    .menu-item-card.esgotado {
      opacity: 0.62;
      filter: grayscale(0.3);
    }

    .menu-item-media {
      position: relative;
      width: 100%;
      height: 145px;
      background: radial-gradient(circle at center, #00363A 0%, #001A1D 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    @media (max-width: 768px) {
      .menu-item-media {
        height: 115px;
      }
    }

    .menu-item-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .menu-item-card:hover .menu-item-media img {
      transform: scale(1.05);
    }

    .media-placeholder-svg {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-gold-soft);
    }

    .item-category-tag {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(0, 22, 24, 0.88);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--text-slate);
      font-size: 0.62rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      padding: 0.2rem 0.5rem;
      border-radius: 999px;
      max-width: 58%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-stock-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      font-size: 0.62rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 0.2rem 0.5rem;
      border-radius: 999px;
      backdrop-filter: blur(6px);
      white-space: nowrap;
    }

    .item-stock-badge.disponivel {
      background: rgba(0, 184, 148, 0.92);
      color: #FFFFFF;
      box-shadow: 0 2px 8px rgba(0, 184, 148, 0.35);
    }

    .item-stock-badge.baixo {
      background: rgba(245, 158, 11, 0.95);
      color: #001618;
    }

    .item-stock-badge.esgotado {
      background: rgba(220, 38, 38, 0.92);
      color: #FFFFFF;
    }

    .menu-item-body {
      padding: 0.75rem 0.75rem 0.85rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex: 1;
      gap: 0.65rem;
    }

    .menu-item-title {
      font-family: 'Outfit', sans-serif;
      font-size: 0.92rem;
      font-weight: 800;
      color: #FFFFFF;
      line-height: 1.25;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 2.3em;
      word-break: break-word;
    }

    @media (max-width: 768px) {
      .menu-item-title {
        font-size: 0.85rem;
      }
    }

    .menu-item-footer {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 0.5rem;
      padding-top: 0.55rem;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .price-label {
      font-size: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      font-weight: 700;
      display: block;
      line-height: 1;
      margin-bottom: 2px;
    }

    .price-value {
      font-family: 'Teko', sans-serif;
      font-size: 1.65rem;
      font-weight: 700;
      line-height: 0.92;
      color: var(--accent-gold-soft);
      text-shadow: 0 0 14px rgba(255, 183, 3, 0.25);
    }

    @media (max-width: 768px) {
      .price-value {
        font-size: 1.45rem;
      }
    }

    .btn-simular-item {
      background: rgba(0, 184, 148, 0.16);
      color: #34D399;
      border: 1px solid rgba(0, 184, 148, 0.45);
      border-radius: 8px;
      padding: 0.4rem 0.65rem;
      font-size: 0.72rem;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.25rem;
      transition: all 0.2s;
      min-height: 34px;
      white-space: nowrap;
    }

    .btn-simular-item:hover:not(:disabled) {
      background: var(--accent-emerald);
      color: #001618;
    }

    .btn-simular-item:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      border-color: rgba(255, 255, 255, 0.12);
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.04);
    }

    .btn-simular-item.selecionado {
      background: var(--accent-orange);
      border-color: var(--accent-orange);
      color: #FFFFFF;
    }

    /* Barra Flutuante de Simulação de Pedido */
    .simulador-bar {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 18px);
      max-width: 620px;
      background: linear-gradient(135deg, #002B2F 0%, #00191C 100%);
      border: 1.5px solid var(--accent-orange);
      border-radius: 14px;
      padding: 0.75rem 1rem;
      z-index: 60;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.7);
      display: none;
      flex-direction: column;
      gap: 0.6rem;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .simulador-bar.visivel {
      display: flex;
    }

    .simulador-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.65rem;
      flex-wrap: wrap;
    }

    .simulador-items-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      max-height: 95px;
      overflow-y: auto;
      scrollbar-width: thin;
    }

    .simulador-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.14);
      padding: 0.22rem 0.55rem;
      border-radius: 999px;
      font-size: 0.72rem;
      color: #FFFFFF;
      font-weight: 600;
    }

    .simulador-pill button {
      background: transparent;
      border: none;
      color: #FCA5A5;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      padding: 2px;
    }
  </style>
</head>

<body class="cantina-menu-body">

  <!-- Decorações Seguras de Fundo -->
  <div class="bg-decorations-wrapper">
    <div class="bg-mesh-pattern"></div>
    <div class="bg-glow-tl"></div>
    <div class="bg-glow-br"></div>
  </div>

  <!-- Barra Superior -->
  <header class="menu-topbar">
    <div class="menu-topbar-inner">
      <a href="index.html" class="brand-cluster">
        <img src="img/acamp-sinodal-logo.png" alt="Acamp Sinodal" onerror="this.onerror=null; this.src='img/logo.png';">
        <div class="brand-title-wrap">
          <div class="brand-title-main">CANTINA ACAMP SINODAL</div>
          <div class="brand-title-sub">Cardápio em Tempo Real</div>
        </div>
      </a>

      <div class="topbar-actions">
        <button type="button" class="btn-hud" onclick="carregarCardapioPublico(true)" title="Atualizar cardápio agora">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/></svg>
          <span>Atualizar</span>
        </button>
        <button type="button" class="btn-hud btn-hud-orange" onclick="compartilharCardapio()" title="Compartilhar link do cardápio">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
          <span>Compartilhar</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <main class="menu-main-container">

    <!-- Filtros, Status e Busca Compactos -->
    <section class="controls-panel">
      <div class="status-and-search-row">
        <!-- Status da Cantina / Caixa -->
        <span id="status-cantina-pill" class="status-pill-live">
          <span class="pulse-dot"></span>
          <span id="status-cantina-text">Carregando status...</span>
        </span>

        <!-- Campo de Busca -->
        <div class="search-input-wrap">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="text" id="menu-search-input" class="search-input" placeholder="Buscar lanche, bebida ou doce..." oninput="renderizarProdutosCardapio()">
        </div>
      </div>

      <!-- Linha de Opções & Contador -->
      <div class="filter-options-row">
        <label class="filter-available-label">
          <input type="checkbox" id="chk-somente-disponiveis" onchange="renderizarProdutosCardapio()">
          <span>Apenas disponíveis em estoque</span>
        </label>
        <div class="total-produtos-counter">
          Mostrando <strong id="contador-filtrados">0</strong> item(ns)
        </div>
      </div>

      <!-- Categorias em Chips deslizáveis -->
      <div class="cat-chips-row" id="menu-categorias-chips">
        <button type="button" class="cat-chip-btn active" onclick="selecionarCategoriaCardapio('TODAS')">Todos os Itens</button>
      </div>
    </section>

    <!-- Grid de Produtos Responsiva -->
    <section id="menu-produtos-grid" class="menu-grid">
      <div style="grid-column: 1 / -1; text-align: center; padding: 3rem 1rem; color: var(--text-slate);">
        Carregando itens disponíveis na cantina...
      </div>
    </section>

  </main>

  <!-- Barra Flutuante: Calculadora / Simulador de Pedido do Participante -->
  <div id="simulador-pedido-bar" class="simulador-bar">
    <div class="simulador-top-row">
      <div style="display: flex; align-items: center; gap: 0.5rem;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FF7900" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
        <div>
          <div style="font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); font-weight: 700;">Simulador de Consumo</div>
          <div style="font-size: 0.88rem; font-weight: 800; color: #FFFFFF;">
            Total: <span id="simulador-total-valor" class="tabular-nums" style="color: var(--accent-gold-soft); font-size: 1.05rem;">R$ 0,00</span>
          </div>
        </div>
      </div>

      <button type="button" class="btn-hud" onclick="limparSimuladorCardapio()" style="padding: 0.3rem 0.65rem; min-height: 30px; font-size: 0.72rem;">
        Limpar
      </button>
    </div>

    <div id="simulador-items-container" class="simulador-items-list"></div>
  </div>

  <script src="js/api.js"></script>
  <script>
    let cardapioProdutos = [];
    let cardapioCategorias = [];
    let categoriaSelecionada = 'TODAS';
    let sacolaSimulada = {}; // { [produtoId]: quantidade }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function formatarMoeda(valor) {
      return Number(valor || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    async function carregarCardapioPublico(mostrarAviso = false) {
      try {
        const res = await API.request('/admin/cantina/cardapio-publico');
        cardapioProdutos = Array.isArray(res?.produtos) ? res.produtos : [];
        cardapioCategorias = Array.isArray(res?.categorias) ? res.categorias : [];

        const pill = document.getElementById('status-cantina-pill');
        const txt = document.getElementById('status-cantina-text');
        if (pill && txt) {
          if (res?.cantina_aberta) {
            pill.classList.remove('fechada');
            txt.textContent = 'Cantina Aberta';
          } else {
            pill.classList.add('fechada');
            txt.textContent = 'Cantina Fechada';
          }
        }

        renderizarChipsCategorias();
        renderizarProdutosCardapio();

        if (mostrarAviso) {
          showToast('Cardápio atualizado!', 'info');
        }
      } catch (err) {
        const grid = document.getElementById('menu-produtos-grid');
        if (grid) {
          grid.innerHTML = `
            <div style="grid-column: 1 / -1; text-align: center; padding: 2.5rem 1rem; background: rgba(0,30,35,0.75); border: 1px solid rgba(255,255,255,0.12); border-radius: 14px;">
              <p style="font-weight: 700; color: #F8FAFC; margin-bottom: 0.25rem;">Não foi possível carregar o cardápio.</p>
              <p style="font-size: 0.82rem; color: var(--text-muted);">Toque em Atualizar para tentar novamente.</p>
            </div>
          `;
        }
      }
    }

    function renderizarChipsCategorias() {
      const container = document.getElementById('menu-categorias-chips');
      if (!container) return;

      const todasAtiva = categoriaSelecionada === 'TODAS' ? 'active' : '';
      let html = `
        <button type="button" class="cat-chip-btn ${todasAtiva}" onclick="selecionarCategoriaCardapio('TODAS')">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg>
          <span>Todos (${cardapioProdutos.length})</span>
        </button>
      `;

      cardapioCategorias.forEach(cat => {
        const count = cardapioProdutos.filter(p => p.categoria === cat).length;
        const isAtiva = categoriaSelecionada === cat ? 'active' : '';
        html += `
          <button type="button" class="cat-chip-btn ${isAtiva}" onclick="selecionarCategoriaCardapio('${escapeHtml(cat).replace(/'/g, "\\'")}')">
            <span>${escapeHtml(cat)} (${count})</span>
          </button>
        `;
      });

      container.innerHTML = html;
    }

    window.selecionarCategoriaCardapio = function(cat) {
      categoriaSelecionada = cat;
      renderizarChipsCategorias();
      renderizarProdutosCardapio();
    };

    window.renderizarProdutosCardapio = function() {
      const grid = document.getElementById('menu-produtos-grid');
      const counterEl = document.getElementById('contador-filtrados');
      if (!grid) return;

      const busca = (document.getElementById('menu-search-input')?.value || '').toLowerCase().trim();
      const somenteDisponiveis = Boolean(document.getElementById('chk-somente-disponiveis')?.checked);

      const filtrados = cardapioProdutos.filter(p => {
        if (categoriaSelecionada !== 'TODAS' && p.categoria !== categoriaSelecionada) return false;
        if (somenteDisponiveis && !p.disponivel) return false;
        if (busca) {
          const matchNome = (p.nome || '').toLowerCase().includes(busca);
          const matchCat = (p.categoria || '').toLowerCase().includes(busca);
          if (!matchNome && !matchCat) return false;
        }
        return true;
      });

      if (counterEl) {
        counterEl.textContent = filtrados.length;
      }

      if (filtrados.length === 0) {
        grid.innerHTML = `
          <div style="grid-column: 1 / -1; text-align: center; padding: 2.5rem 1rem; background: rgba(0,30,35,0.75); border: 1px dashed rgba(255,255,255,0.18); border-radius: 14px;">
            <div style="display: inline-flex; width: 44px; height: 44px; border-radius: 10px; background: rgba(255,255,255,0.06); align-items: center; justify-content: center; color: var(--text-muted); margin-bottom: 0.5rem;">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
            </div>
            <h3 style="font-size: 1rem; font-weight: 800; color: #FFFFFF; margin-bottom: 0.2rem;">Nenhum produto encontrado</h3>
            <p style="font-size: 0.8rem; color: var(--text-muted);">Experimente limpar a busca ou selecionar outra categoria.</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = filtrados.map(p => {
        const qtd = Number(p.quantidade_estoque || 0);
        const disp = Boolean(p.disponivel && qtd > 0);

        let stockBadgeClass = 'disponivel';
        let stockText = `${qtd} un.`;
        if (!disp) {
          stockBadgeClass = 'esgotado';
          stockText = 'Esgotado';
        } else if (qtd <= 5) {
          stockBadgeClass = 'baixo';
          stockText = `Últimas ${qtd}`;
        }

        const imgHtml = p.imagem_url
          ? `<img src="${escapeHtml(p.imagem_url)}" alt="${escapeHtml(p.nome)}" loading="lazy" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
             <div class="media-placeholder-svg" style="display:none;">
               <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
             </div>`
          : `<div class="media-placeholder-svg">
               <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
             </div>`;

        const qtdNaSacola = sacolaSimulada[p.id] || 0;

        return `
          <article class="menu-item-card ${!disp ? 'esgotado' : ''}">
            <div>
              <div class="menu-item-media">
                ${imgHtml}
                <span class="item-category-tag">${escapeHtml(p.categoria || 'Geral')}</span>
                <span class="item-stock-badge ${stockBadgeClass} tabular-nums">${stockText}</span>
              </div>

              <div class="menu-item-body">
                <h2 class="menu-item-title" title="${escapeHtml(p.nome)}">${escapeHtml(p.nome)}</h2>

                <div class="menu-item-footer">
                  <div>
                    <span class="price-label">Valor</span>
                    <div class="price-value tabular-nums">${formatarMoeda(p.preco_venda)}</div>
                  </div>

                  <button type="button" class="btn-simular-item ${qtdNaSacola > 0 ? 'selecionado' : ''}" ${!disp ? 'disabled' : ''} onclick="adicionarItemSimulador(${p.id})">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    <span>${qtdNaSacola > 0 ? `${qtdNaSacola}x` : 'Simular'}</span>
                  </button>
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    };

    window.adicionarItemSimulador = function(produtoId) {
      const prod = cardapioProdutos.find(p => p.id === produtoId);
      if (!prod || !prod.disponivel) return;

      const atual = sacolaSimulada[produtoId] || 0;
      if (atual + 1 > prod.quantidade_estoque) {
        showToast(`Apenas ${prod.quantidade_estoque} unidade(s) disponível(is) em estoque.`, 'info');
        return;
      }
      sacolaSimulada[produtoId] = atual + 1;
      atualizarBarraSimulador();
      renderizarProdutosCardapio();
    };

    window.removerItemSimulador = function(produtoId) {
      if (!sacolaSimulada[produtoId]) return;
      delete sacolaSimulada[produtoId];
      atualizarBarraSimulador();
      renderizarProdutosCardapio();
    };

    window.limparSimuladorCardapio = function() {
      sacolaSimulada = {};
      atualizarBarraSimulador();
      renderizarProdutosCardapio();
    };

    function atualizarBarraSimulador() {
      const bar = document.getElementById('simulador-pedido-bar');
      const list = document.getElementById('simulador-items-container');
      const totalEl = document.getElementById('simulador-total-valor');
      if (!bar || !list || !totalEl) return;

      const ids = Object.keys(sacolaSimulada).map(Number).filter(id => sacolaSimulada[id] > 0);
      if (ids.length === 0) {
        bar.classList.remove('visivel');
        return;
      }

      let soma = 0;
      const pillsHtml = ids.map(id => {
        const prod = cardapioProdutos.find(p => p.id === id);
        if (!prod) return '';
        const q = sacolaSimulada[id];
        soma += Number(prod.preco_venda || 0) * q;
        return `
          <span class="simulador-pill tabular-nums">
            <span>${q}x ${escapeHtml(prod.nome)}</span>
            <button type="button" onclick="removerItemSimulador(${id})" title="Remover item">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
          </span>
        `;
      }).join('');

      totalEl.textContent = formatarMoeda(soma);
      list.innerHTML = pillsHtml;
      bar.classList.add('visivel');
    }

    window.compartilharCardapio = async function() {
      const url = window.location.href;
      if (navigator.share) {
        try {
          await navigator.share({
            title: 'Cardápio da Cantina — Acamp Sinodal',
            text: 'Confira os produtos e preços disponíveis na cantina do Acamp Sinodal:',
            url: url
          });
          return;
        } catch (e) {}
      }
      if (navigator.clipboard) {
        await navigator.clipboard.writeText(url);
        showToast('Link do cardápio copiado!', 'info');
      }
    };

    document.addEventListener('DOMContentLoaded', () => {
      carregarCardapioPublico(false);
      // Atualização automática periódica a cada 30 segundos
      setInterval(() => carregarCardapioPublico(false), 30000);
    });
  </script>
</body>

</html>
